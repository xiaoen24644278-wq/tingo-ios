name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: 构建 HuiT APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: true
      CARGO_NET_RETRY: "10"
      CARGO_HTTP_TIMEOUT: "120"
      CARGO_HTTP_MULTIPLEXING: "false"

    steps:
      - uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          # Rust + sherpa-onnx 的 .so 很大，ubuntu runner 默认 14G 不够用
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/system-images || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY/haskell" || true
          df -h / | tail -2

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 不用 android-actions/setup-android@v3：它会 `sdkmanager tools` 装已废弃的 legacy tools 包，
      # 在新版 cmdline-tools 上直接 "Failed to find package 'tools'" 退出。
      # ubuntu runner 自带 Android SDK（含 NDK），这里只补齐缺的部分。
      - name: 准备 Android SDK 与 NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager || true)"
          echo "SDK=$SDK"; echo "sdkmanager=$SDKM"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          if ! ls -d "$SDK"/ndk/* >/dev/null 2>&1; then
            echo "runner 没带 NDK，装一个"
            "$SDKM" "ndk;27.0.12077973"
          fi
          NDK="$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -1)"
          if [ -n "$NDK" ]; then
            echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
            echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
            echo "NDK=$NDK"
          else
            echo "没有可用 NDK" >&2; exit 1
          fi

      - name: 安装 pnpm
        run: |
          corepack enable
          PM="$(node -p "require('./app/package.json').packageManager || 'pnpm@latest'")"
          corepack prepare "$PM" --activate || npm install -g pnpm

      - name: 安装 Rust 与 Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: 预热 Rust 依赖
        continue-on-error: true
        run: |
          cd app/src-tauri
          for i in 1 2 3; do
            cargo fetch --target aarch64-linux-android && break
            sleep 10
          done

      - name: 构建 APK
        run: bash app/scripts/build-apk.sh

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: HuiT-android-apk
          path: build/android/*.apk
          retention-days: 14
          if-no-files-found: error
