<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <title>会听 HuiT</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20viewBox=%270%200%2032%2032%27%20xmlns=%27http://www.w3.org/2000/svg%27%3E%3Crect%20width=%2732%27%20height=%2732%27%20rx=%277.2%27%20fill=%27%230B0E17%27/%3E%3Cg%20fill=%27%23FFFFFF%27%3E%3Crect%20x=%276.4%27%20y=%2713.6%27%20width=%272.5%27%20height=%274.8%27%20rx=%271.25%27/%3E%3Crect%20x=%2711.1%27%20y=%2711%27%20width=%272.5%27%20height=%2710%27%20rx=%271.25%27/%3E%3Crect%20x=%2715.8%27%20y=%278.4%27%20width=%272.5%27%20height=%2715.2%27%20rx=%271.25%27/%3E%3Crect%20x=%2720.5%27%20y=%2711%27%20width=%272.5%27%20height=%2710%27%20rx=%271.25%27/%3E%3Crect%20x=%2725.2%27%20y=%2713.6%27%20width=%272.5%27%20height=%274.8%27%20rx=%271.25%27/%3E%3C/g%3E%3Ccircle%20cx=%2717.05%27%20cy=%2720.2%27%20r=%272.1%27%20fill=%27%23E8FF2E%27/%3E%3C/svg%3E">
</head>
<body>
  <!-- 启动画面：原生 LaunchScreen 已经是黑底，这里用同一个黑底 + logo 接上，
       数据加载完再淡出，视觉上是一段连贯的开场，不会出现白闪。 -->
  <div class="splash" id="splash" aria-hidden="true">
    <svg class="splash-logo" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
      <g fill="#FFFFFF">
        <rect x="8" y="52" width="9" height="16" rx="4.5"/>
        <rect x="23" y="44" width="9" height="32" rx="4.5"/>
        <rect x="38" y="33" width="9" height="54" rx="4.5"/>
        <rect x="53" y="24" width="9" height="72" rx="4.5"/>
        <rect x="68" y="33" width="9" height="54" rx="4.5"/>
        <rect x="83" y="44" width="9" height="32" rx="4.5"/>
        <rect x="98" y="52" width="9" height="16" rx="4.5"/>
      </g>
      <circle cx="57.5" cy="74" r="7.5" fill="#E8FF2E"/>
    </svg>
  </div>
  <div class="app booting" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="side-inner">
        <div class="side-top">
          <a class="brand" href="#/">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox='0 0 32 32' xmlns='http://www.w3.org/2000/svg'><rect width='32' height='32' rx='7.2' fill='#0B0E17'/><g fill='#FFFFFF'><rect x='6.4' y='13.6' width='2.5' height='4.8' rx='1.25'/><rect x='11.1' y='11' width='2.5' height='10' rx='1.25'/><rect x='15.8' y='8.4' width='2.5' height='15.2' rx='1.25'/><rect x='20.5' y='11' width='2.5' height='10' rx='1.25'/><rect x='25.2' y='13.6' width='2.5' height='4.8' rx='1.25'/></g><circle cx='17.05' cy='20.2' r='2.1' fill='#E8FF2E'/></svg>
            </span>
            <span class="brand-name">会听</span>
            <span class="brand-tag" data-t="HuiT|HuiT">HuiT</span>
          </a>
          <button class="side-toggle" id="sideToggle" type="button" aria-controls="sidebar" aria-expanded="true">
            <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3.5"/><path d="M9.5 4.5v15"/></svg>
          </button>
        </div>

        <a class="side-item new-meeting" href="#/" data-nav="home">
          <span class="side-ico">
            <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
            <span class="live-dot"></span>
          </span>
          <span class="side-label" data-t="新会议|New meeting">新会议</span>
        </a>

        <nav class="nav">
          <a class="side-item" href="#/meetings" data-nav="meetings">
            <svg viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="3"/><path d="M8 8.5h8M8 12h8M8 15.5h5"/></svg>
            <span class="side-label" data-t="会议记录|Meetings">会议记录</span>
          </a>
          <a class="side-item rail-only" id="railTasks" href="#/" hidden></a>
        </nav>

        <div class="side-scroll">
          <div class="side-tasks" id="sideTasks" hidden></div>
          <div class="recent">
            <div class="recent-head" data-t="最近|Recent">最近</div>
            <div id="recentList"></div>
          </div>
        </div>

        <div class="side-foot">
          <div class="env" id="envBox"></div>
          <a class="side-item rail-only" id="envRail" href="#/settings/about" hidden></a>
          <a class="side-item" href="#/settings" data-nav="settings">
            <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
            <span class="side-label" data-t="设置|Settings">设置</span>
          </a>
        </div>
      </div>
    </aside>
    <div class="side-scrim" id="sideScrim" hidden></div>

    <main class="main" id="main"></main>

    <!-- 移动端底部常驻导航栏（≤820px 竖屏显示，替代右上角孤立的抽屉按钮） -->
    <nav class="bottom-nav" id="bottomNav" aria-label="主导航">
      <a class="bnav-item active" href="#/" data-bnav="home">
        <span class="bnav-ico">
          <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
          <span class="live-dot"></span>
        </span>
        <span class="bnav-label" data-t="新会议|Record">新会议</span>
      </a>
      <a class="bnav-item" href="#/meetings" data-bnav="meetings">
        <span class="bnav-ico">
          <svg viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="3"/><path d="M8 8.5h8M8 12h8M8 15.5h5"/></svg>
          <b class="bnav-badge" id="bnavBadge" hidden></b>
        </span>
        <span class="bnav-label" data-t="会议记录|Meetings">会议记录</span>
      </a>
      <a class="bnav-item" href="#/settings" data-bnav="settings">
        <span class="bnav-ico">
          <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
        </span>
        <span class="bnav-label" data-t="设置|Settings">设置</span>
      </a>
    </nav>
  </div>

  <div class="drop-overlay" id="dropOverlay">
    <div class="drop-card">
      <svg viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>
      <div data-t="松开导入录音，自动转写并生成纪要|Drop to import — HuiT will transcribe it and write the minutes">松开导入录音，自动转写并生成纪要</div>
      <small data-t="支持 m4a、mp3、wav、mp4 等，腾讯会议、飞书的录制文件都行|m4a, mp3, wav, mp4 and more — recordings from Zoom, Teams, Tencent Meeting or Feishu all work">支持 m4a、mp3、wav、mp4 等，腾讯会议、飞书的录制文件都行</small>
    </div>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <input type="file" id="fileInput" accept="audio/*,video/*,.m4a,.mp3,.wav,.mp4,.aac,.flac,.ogg,.webm,.mov,.mkv" hidden>

  <script type="module" src="/src/main.ts"></script>
  <script>
    (function () { // 仅 iOS 的 WKWebView：给 <html> 打 is-ios，供 CSS 里安全区 / 隐藏拖拽遮罩用
      var ua = navigator.userAgent, html = document.documentElement;
      var ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      var tauri = !!window.__TAURI__ || !!window.__TAURI_INTERNALS__ || /tauri/i.test(location.protocol + location.hostname);
      if (ios && tauri) html.className += (html.className ? " " : "") + "is-ios";
    })();
  </script>
</body>
</html>
